default:
  image: node:20.17-alpine

# Cache modules in between jobs
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm/

tests:
  script:
   - npm ci --cache .npm --prefer-offline
   - npm run test:ci
  coverage: /All files[^\|]*\|[^\|]*\s+([\d\.]+)/
  #coverage: /All files[^|]*\|[^|]*\s+([\d\.]+)/