<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion de fichiers</title>
</head>
<body>
  <div id="app">
    <button id="infoButton">Afficher info</button>
    <p id="infoText"></p>

    <h1>Recherche de fichiers</h1>
    <input id="searchInput" placeholder="Entrez votre recherche" />
    <button id="searchButton">Rechercher</button>

    <ul id="resultsList"></ul>

    <h1>Ajouter un fichier aux favoris</h1>
    <input id="addInput" placeholder="Entrez le nom du fichier HTML" />
    <button id="addButton">Ajouter</button>
    <p id="addMsg"></p>

    <h1>Supprimer un fichier des favoris</h1>
    <input id="removeInput" placeholder="Entrez le nom du fichier HTML" />
    <button id="removeButton">Supprimer</button>
    <p id="remMsg"></p>

    <p id="errorText" style="color: red;"></p>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const infoButton = document.getElementById("infoButton");
      const infoText = document.getElementById("infoText");

      const searchInput = document.getElementById("searchInput");
      const searchButton = document.getElementById("searchButton");
      const resultsList = document.getElementById("resultsList");

      const addInput = document.getElementById("addInput");
      const addButton = document.getElementById("addButton");
      const addMsg = document.getElementById("addMsg");

      const removeInput = document.getElementById("removeInput");
      const removeButton = document.getElementById("removeButton");
      const remMsg = document.getElementById("remMsg");

      const errorText = document.getElementById("errorText");

      const apiUrl = "https://web-2.local.test/api";

      function clearError() {
        errorText.textContent = "";
      }

      async function fetchInfo() {
        clearError();
        try {
          const response = await fetch(`https://web-2.local.test/api/info`);
          if (!response.ok) {
            throw new Error(`Erreur serveur : ${response.status} - ${response.statusText}`);
          }
          const text = await response.text();
          infoText.textContent = text;
        } catch (err) {
          errorText.textContent = "Impossible de contacter le serveur.";
        }
      }

      async function searchFiles() {
        clearError();
        try {
          const query = searchInput.value;
          const response = await fetch(`${apiUrl}/search?text=${encodeURIComponent(query)}`);
          if (!response.ok) {
            throw new Error(`Erreur serveur : ${response.status} - ${response.statusText}`);
          }
          const results = await response.json();
          resultsList.innerHTML = results.map(file => `<li>${file}</li>`).join("");
        } catch (err) {
          errorText.textContent = "Impossible de contacter le serveur.";
        }
      }

      async function addFile() {
        clearError();
        const query = addInput.value.trim();
        if (!query.endsWith(".html")) {
          errorText.textContent = "Veuillez entrer un fichier HTML valide (exemple : fichier.html).";
          return;
        }

        try {
          const response = await fetch(`${apiUrl}/add/${query}`, { method: "POST" });
          if (!response.ok) {
            throw new Error(`Erreur serveur : ${response.status} - ${response.statusText}`);
          }
          const message = await response.text();
          addMsg.textContent = message;
        } catch (err) {
          errorText.textContent = "Impossible de contacter le serveur.";
        }
      }

      async function removeFile() {
        clearError();
        const query = removeInput.value.trim();
        if (!query.endsWith(".html")) {
          errorText.textContent = "Veuillez entrer un fichier HTML valide (exemple : fichier.html).";
          return;
        }

        try {
          const response = await fetch(`${apiUrl}/remove/${query}`, { method: "DELETE" });
          if (!response.ok) {
            throw new Error(`Erreur serveur : ${response.status} - ${response.statusText}`);
          }
          const message = await response.text();
          remMsg.textContent = message;
        } catch (err) {
          errorText.textContent = "Impossible de contacter le serveur.";
        }
      }

      infoButton.addEventListener("click", fetchInfo);
      searchButton.addEventListener("click", searchFiles);
      addButton.addEventListener("click", addFile);
      removeButton.addEventListener("click", removeFile);
    });
  </script>
</body>
</html>
